name = "portfolio-chat-worker"
main = "src/index.js"
compatibility_date = "2026-07-17"

# Account ID - Get from: https://dash.cloudflare.com/
# Look for "Account ID" in the right sidebar
account_id = "e61ec..................."

# Workers configuration
workers_dev = true

# Environment variables (secrets - set via wrangler secret put CLI)
# wrangler secret put TELEGRAM_BOT_TOKEN
# wrangler secret put TELEGRAM_CHAT_ID

[vars]
ALLOWED_ORIGIN = "*"
MAX_MESSAGE_LENGTH = "2000"
ENABLE_RATE_LIMITING = "true"

# Compatibility flags
compatibility_flags = ["nodejs_compat"]

[[migrations]]
tag = "v2"
deleted_classes = ["ChatSession"]